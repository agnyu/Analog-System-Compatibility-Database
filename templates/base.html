<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Analog Photography Compatibility Database{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body>
    <div class="container">
        <section class="hero">
            <h1>Analog Photography Compatibility Database</h1>
            <p>
                Search cameras, film stocks, lenses, mounts, accessories, and documentation.
                For the current prototype, Film Stocks is the active and working CRUD module.
            </p>
        </section>

        <nav class="nav-tabs">
            <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active-tab{% endif %}">
                Home
            </a>
            <a href="{{ url_for('film') }}"
            class="{% if request.endpoint == 'film' %}active-tab{% endif %}">
            Film
            </a>

            <a href="{{ url_for('cameras') }}"
             class="{% if request.endpoint == 'cameras' %}active-tab{% endif %}">
            Cameras
            </a>

            <a href="{{ url_for('lenses') }}"
            class="{% if request.endpoint == 'lenses' %}active-tab{% endif %}">
            Lenses
            </a>
            <a href="#">Mounts</a>
            <a href="{{ url_for('accessories') }}"
            class="{% if request.endpoint == 'accessories' %}active-tab{% endif %}">
            Accessories
            </a>
            <a href="#">Documentation</a>
        </nav>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
