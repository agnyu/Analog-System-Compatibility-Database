{% extends "base.html" %}

{% block title %}Edit Film{% endblock %}

{% block content %}
<section class="card form-card">
    <h2>Edit Film</h2>
    <p class="subtext">Update an existing film stock record in the prototype database.</p>

    <form method="POST">
        <div class="two-column-form">
            <div class="form-control">
                <label for="film_name">Film Name</label>
                <input type="text" id="film_name" name="film_name" value="{{ film.film_name }}" required>
            </div>

            <div class="form-control">
                <label for="manufacturer_id">Manufacturer</label>
                <select id="manufacturer_id" name="manufacturer_id" required>
                    {% for manufacturer in manufacturers %}
                    <option value="{{ manufacturer.manufacturer_id }}"
                        {% if manufacturer.manufacturer_id == film.manufacturer_id %}selected{% endif %}>
                        {{ manufacturer.manufacturer_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-control">
                <label for="iso">ISO</label>
                <input type="number" id="iso" name="iso" value="{{ film.iso }}">
            </div>

            <div class="form-control">
                <label for="format_id">Format</label>
                <select id="format_id" name="format_id" required>
                    {% for format in formats %}
                    <option value="{{ format.format_id }}"
                        {% if format.format_id == film.format_id %}selected{% endif %}>
                        {{ format.format_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-control">
                <label for="color_type">Color Type</label>
                <input type="text" id="color_type" name="color_type" value="{{ film.color_type }}">
            </div>

            <div class="form-control">
                <label for="release_year">Release Year</label>
                <input type="number" id="release_year" name="release_year" value="{{ film.release_year }}">
            </div>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="discontinued" name="discontinued"
                {% if film.discontinued %}checked{% endif %}>
            <label for="discontinued">Discontinued</label>
        </div>

        <div class="form-control">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes">{{ film.notes }}</textarea>
        </div>

        <div class="button-row">
            <button class="btn" type="submit">Update Film</button>
            <a class="btn-secondary" href="{{ url_for('index') }}">Back to Film List</a>
        </div>
    </form>
</section>
{% endblock %}
